<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>FIG-2026</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="description" content="Maps" />
  <meta name="keywords" content="" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@viglino" />
  <meta name="twitter:creator" content="@viglino" />
  <meta name="twitter:title" content="C'est-où ?" />
  <meta name="twitter:description" content="Localisez les lieux à partir d'une photographie aérienne." />
  <meta name="twitter:image" content="https://viglino.github.io/maps/src/geoloc/screen.jpg" />

  <link rel="icon" type="image/png" href="./cestou/logo.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="msapplication-tap-highlight" content="no">   

  <!-- API -->
  <script type="text/javascript" src="https://ignf.gitlab.io/macarte/mcviewer/MapIFrameAPI.js"></script>

<body data-game>
  <div class="backdrop"></div>
  <div class="zoom">
    <button class="out"></button>
    <button class="in"></button>
    <button class="close"></button>
  </div>
  <header>
    <h1>FIG-2026 🎲</h1>
    <div></div>
  </header>
  <main>
    <aside>
      <button class="img"><img /></button>
      <button class="ortho"><img src="https://data.geopf.fr/wmts?layer=ORTHOIMAGERY.ORTHOPHOTOS&style=normal&tilematrixset=PM&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image%2Fjpeg&TileMatrix=9&TileCol=265&TileRow=177" /></button>
      <button class="map"><img src="https://data.geopf.fr/wmts?layer=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&style=normal&tilematrixset=PM&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image%2Fpng&TileMatrix=9&TileCol=265&TileRow=177" /></button>
    </aside>
    <section>
      <iframe id="map" src="https://macarte.ign.fr/carte/7ykTrt/Jeu-Saint-Die" allow="clipboard-read; clipboard-write"></iframe>
      <div class="zoomToPlay">
        <p>Zoomer sur le lieu...</p>
      </div>
      <div class="validate">
        <button>Valider cette position</button>
      </div>
    </section>
  </main>
  <footer>
  </footer>

  <dialog class="start">
    <h2>paysage</h2>
    <div class="content">
      <p>info</p>
      <input type="text" />
      <div class="buttons">
        <button>Démarrer</button>
      </div>
    </div>
  </dialog>

  <dialog class="dist">
    <h2>paysage</h2>
    <div class="content">
      <p>Vous êtes à <span></span> de la photo</p>
      <div class="buttons">
        <button class="again">Essaye encore !</button>
        <button class="win">Bravo !</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="./geoloc/index.js"></script>
</body>
</html>
